<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chatbot Suối Tiên</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#1a5e2a;--green-main:#2d8c47;--green-light:#e8f5ec;--green-pale:#f0f8f2;--bg:#f4f1ec;--text:#1a1a1a;--text-muted:#7a7a7a;--radius:18px;--shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);overflow:hidden}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:481px){body{display:flex;align-items:center;justify-content:center;background:#e0ddd6}.app{height:96vh;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg)}}

/* Header with red-gold top border */
.header-border{height:4px;background:linear-gradient(90deg,#c0392b 0%,#e74c3c 30%,#f1c40f 60%,#c8a84e 100%);flex-shrink:0}
.header{background:linear-gradient(135deg,var(--green-dark),var(--green-main));padding:14px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);border-radius:50%}
.header-logo{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.3);overflow:hidden;flex-shrink:0;background:white;display:flex;align-items:center;justify-content:center}
.header-logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.header-info{flex:1;z-index:1}
.header-info h1{color:white;font-size:18px;font-weight:700;letter-spacing:-.3px}
.header-info .status{color:rgba(255,255,255,.8);font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px}
.status-dot{width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--bg);scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px}

/* Welcome */
.welcome{text-align:center;padding:30px 20px 20px}
.welcome-logo{width:80px;height:80px;margin:0 auto 16px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);overflow:hidden}
.welcome-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.welcome h2{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;color:var(--text-muted);line-height:1.6}
.welcome p strong{color:var(--green-main)}

/* Messages */
.row{display:flex;align-items:flex-end;gap:8px;max-width:88%;animation:fadeUp .3s ease-out}
.row.u{align-self:flex-end;flex-direction:row-reverse}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:white;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:contain;padding:2px}
.avu{width:32px;height:32px;border-radius:50%;background:var(--green-main);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.mw{display:flex;flex-direction:column;gap:4px;min-width:0}
.bb{padding:12px 16px;border-radius:var(--radius);font-size:14.5px;line-height:1.65;word-wrap:break-word;overflow-wrap:break-word}
.bb.b{background:#fff;color:var(--text);border-bottom-left-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.bb.u{background:var(--green-main);color:white;border-bottom-right-radius:4px}
.bb a{color:var(--green-main);text-decoration:underline}
.bb.u a{color:#b8f0c8}
.bb strong{font-weight:600}

/* Sources */
.src-box{background:var(--green-pale);border-radius:10px;padding:8px 12px;margin-top:2px}
.src-label{font-size:11px;font-weight:600;color:var(--green-main);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.src-link{font-size:12px;color:var(--green-dark);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.src-link:hover{text-decoration:underline}

/* Timestamp + Feedback */
.bt{font-size:10px;color:var(--text-muted);padding:0 4px}
.fbr{display:flex;gap:6px;margin-top:2px}
.fb{border:1px solid #ddd;background:transparent;border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer;transition:all .2s}
.fb:hover{background:var(--green-pale);transform:scale(1.1)}
.fb.on{background:var(--green-main);border-color:var(--green-main);transform:scale(1.15)}
.fb:disabled{opacity:.3;cursor:default;transform:none}

/* Typing */
.typb{background:#fff;border-radius:var(--radius);border-bottom-left-radius:4px;padding:14px 18px;display:flex;gap:5px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.td{width:8px;height:8px;border-radius:50%;background:#bbb;animation:bonce 1.4s infinite}
.td:nth-child(2){animation-delay:.2s}
.td:nth-child(3){animation-delay:.4s}
@keyframes bonce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Weather Card */
.weather-card{background:linear-gradient(135deg,#2d8c47,#1a5e2a);border-radius:14px;padding:14px 16px;color:white;margin:6px 0}
.wc-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.wc-emoji{font-size:38px}.wc-temp{font-size:30px;font-weight:800}.wc-desc{font-size:13px;opacity:.9;text-transform:capitalize}
.wc-details{display:flex;gap:16px;font-size:12px;opacity:.85;margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2)}
.wc-tip{font-size:12px;margin-top:6px;padding:6px 10px;background:rgba(255,255,255,.15);border-radius:8px}

/* Maps Button */
.maps-btn{display:inline-flex;align-items:center;gap:8px;background:var(--green-main);color:white;padding:10px 20px;border-radius:24px;text-decoration:none;font-size:14px;font-weight:600;margin:8px 0;transition:all .2s;box-shadow:0 2px 8px rgba(45,140,71,.3)}
.maps-btn:hover{background:var(--green-dark);transform:translateY(-1px)}

/* Quick Buttons */
.qbs{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--bg)}
.qb{border:1.5px solid var(--green-main);background:transparent;color:var(--green-main);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.qb:hover{background:var(--green-main);color:white;transform:translateY(-1px)}

/* Input */
.ia{padding:12px 16px 16px;background:white;border-top:1px solid rgba(0,0,0,.06)}
.ir{display:flex;align-items:flex-end;gap:10px;background:#f5f5f2;border-radius:24px;padding:6px 6px 6px 16px}
.inp{flex:1;border:none;outline:none;resize:none;font-size:15px;line-height:1.4;padding:8px 0;background:transparent;font-family:inherit;color:var(--text);max-height:100px}
.inp::placeholder{color:#aaa}
.ibtn{cursor:pointer;display:flex;align-items:center;opacity:.5;transition:opacity .2s}
.ibtn:hover{opacity:.8}
.ibtn svg{width:22px;height:22px;fill:var(--text-muted)}
#fi{display:none}
.sbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--green-main);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.sbtn:hover{background:var(--green-dark);transform:scale(1.05)}
.sbtn svg{width:20px;height:20px;fill:white;margin-left:2px}

.lang-sw{display:flex;gap:4px;z-index:1}
.lb{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:rgba(255,255,255,.75);
border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;
font-family:inherit;transition:all .18s}
.lb:hover,.lb.on{background:rgba(255,255,255,.2);color:white;border-color:rgba(255,255,255,.7)}

</style>
</head>

function sd(){
  var inp=document.getElementById('inp'),txt=inp.value.trim();
  if(!txt)return;
  inp.value='';inp.style.height='auto';
  lastQuestion=txt;am(txt,true);st();
  var c=document.getElementById('chat');
  var row=document.createElement('div');row.className='row';
  var av=document.createElement('div');av.className='av';
  av.innerHTML='<img src="'+LG+'" alt="ST">';
  var mw=document.createElement('div');mw.className='mw';
  var bb=document.createElement('div');bb.className='bb b';bb.innerHTML='';
  var bt=document.createElement('div');bt.className='bt';bt.textContent=gt();
  mw.appendChild(bb);mw.appendChild(bt);
  row.appendChild(av);row.appendChild(mw);
  var fullText='';var started=false;
  fetch(SAPI,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:txt,session_id:TID})
  }).then(function(r){
    if(!r.ok||!r.body){
      return r.json().then(function(d){rt();am(d.answer||'Xin lỗi, có lỗi.',false,d.sources||[]);});
    }
    var reader=r.body.getReader(),dec=new TextDecoder(),buf='';
    var metaSource='llm',metaIntent='unknown';
    function read(){
      return reader.read().then(function(x){
        if(x.done){
          rt();
          if(fullText){
            var fbr=document.createElement('div');fbr.className='fbr';
            var g=document.createElement('button');g.className='fb';g.textContent='👍';
            var b=document.createElement('button');b.className='fb';b.textContent='👎';
            g.onclick=function(){g.classList.add('on');b.disabled=true;sf(lastQuestion,fullText,1)};
            b.onclick=function(){b.classList.add('on');g.disabled=true;sf(lastQuestion,fullText,0)};
            fbr.appendChild(g);fbr.appendChild(b);mw.appendChild(fbr);
          }
          return;
        }
        buf+=dec.decode(x.value,{stream:true});
        var lines=buf.split('
');buf=lines.pop();
        lines.forEach(function(line){
          if(!line.startsWith('data:'))return;
          var raw=line.slice(5).trim();
          if(raw==='[DONE]')return;
          try{
            var ev=JSON.parse(raw);
            if(ev.type==='meta'){metaSource=ev.source||'llm';metaIntent=ev.intent||'unknown';return;}
            if(ev.type==='error'){rt();am(ev.message||'Lỗi server.',false);return;}
            if(ev.type==='token'&&ev.text){
              fullText+=ev.text;
              if(!started){rt();started=true;c.appendChild(row);c.scrollTop=c.scrollHeight;}
              bb.innerHTML=fmt(fullText);
              c.scrollTop=c.scrollHeight;
            }
          }catch(e){}
        });
        return read();
      });
    }
    return read();
  }).catch(function(){rt();am('Không thể kết nối server. Gọi 1900 636 787.',false)});
}
