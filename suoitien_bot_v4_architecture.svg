  <!-- ================= MEMORY ================= -->
  <text x="40" y="972" class="sec">BỘ NHỚ</text>
  <rect x="40" y="984" width="430" height="120" rx="10" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="56" y="1008" class="ttl">Memory</text>
  <text x="56" y="1030" class="t">• session_store — lịch sử hội thoại / session</text>
  <text x="56" y="1052" class="t">• memory_layer — entity trong 1 hội thoại</text>
  <text x="56" y="1074" class="t">• long_term_memory — profile qua nhiều lần ghé</text>
  <text x="56" y="1094" class="sm">(in-memory, sẵn sàng đổi Redis)</text>

  <!-- ================= LEARNING ================= -->
  <text x="490" y="972" class="sec">TỰ HỌC &amp; CHẤT LƯỢNG</text>
  <rect x="490" y="984" width="430" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="506" y="1008" class="ttl">Self-learning loop</text>
  <text x="506" y="1030" class="t">• response_critic — verdict PASS/IMPROVE/REJECT</text>
  <text x="506" y="1052" class="t">• Golden Store — câu chuẩn người duyệt 👍</text>
  <text x="506" y="1074" class="t">• self_learning — eval + improve + few-shot</text>
  <text x="506" y="1094" class="sm">→ feed Few-shot ngược vào Responder (bước 6)</text>

  <!-- ================= OPS ================= -->
  <text x="960" y="860" class="sec">VẬN HÀNH</text>
  <rect x="960" y="872" width="320" height="232" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="976" y="896" class="ttl">Background / Ops</text>
  <text x="976" y="918" class="t">• auto_updater — crawl sitemap mỗi giờ</text>
  <text x="976" y="938" class="sm">  diff → extract → hot-swap data + index</text>
  <text x="976" y="960" class="t">• vector_search_incremental — thêm vector</text>
  <text x="976" y="980" class="t">• analytics — dashboard query/latency</text>
  <text x="976" y="1000" class="t">• multi_llm — failover router</text>
  <text x="976" y="1019" class="sm">  (riêng cho /analytics/llm)</text>
  <text x="976" y="1042" class="t">• language_detector — vi/en/zh/ko/ja</text>
  <line x1="976" y1="1056" x2="1264" y2="1056" stroke="#fcd34d"/>
  <text x="976" y="1078" class="sm">auto_updater + multi_llm: giữ client LLM riêng</text>
  <text x="976" y="1095" class="sm">(không thuộc chat-path)</text>

