    <text x="115" y="158" text-anchor="middle" class="sm">chat_ui.html</text>

    <rect x="205" y="120" width="120" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="265" y="142" text-anchor="middle" class="t" font-weight="700">Zalo OA</text>
    <text x="265" y="158" text-anchor="middle" class="sm">webhook</text>

    <rect x="340" y="120" width="120" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="400" y="142" text-anchor="middle" class="t" font-weight="700">Messenger</text>
    <text x="400" y="158" text-anchor="middle" class="sm">webhook</text>

    <rect x="475" y="120" width="120" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="535" y="142" text-anchor="middle" class="t" font-weight="700">CMS push</text>
    <text x="535" y="158" text-anchor="middle" class="sm">suoitien.vn</text>
  </g>

  <!-- ================= API ================= -->
  <text x="40" y="206" class="sec">API · FastAPI (main.py)</text>
  <rect x="40" y="218" width="555" height="78" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="56" y="240" class="ttl">Routers</text>
  <text x="56" y="262" class="t">• api/chat.py — POST /api/chat, /api/chat/stream (SSE)</text>
  <text x="56" y="280" class="t">• api/webhook.py (Zalo·FB·Web) · api/webhook_content.py (CMS)</text>

  <!-- health endpoints box -->
  <rect x="615" y="218" width="305" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="631" y="240" class="ttl">Endpoints quản trị</text>
  <text x="631" y="260" class="sm">/health · /analytics · /analytics/llm</text>
  <text x="631" y="278" class="sm">/learning · /critic · /golden · /hub/status</text>

  <!-- arrows channels -> api -->
  <line x1="115" y1="166" x2="115" y2="216" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="265" y1="166" x2="265" y2="216" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="400" y1="166" x2="400" y2="216" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="535" y1="166" x2="535" y2="216" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- ================= PIPELINE ================= -->
  <text x="40" y="334" class="sec">CHAT PIPELINE · chat_pipeline.py</text>
  <rect x="40" y="346" width="880" height="468" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>

  <!-- step boxes -->
  <g>
    <rect x="64" y="368" width="380" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="80" y="386" class="t" font-weight="700">1 · Guardrail.check_input</text>
    <text x="80" y="403" class="sm">chặn jailbreak / prompt-injection · redact PII</text>

    <rect x="64" y="420" width="380" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="80" y="438" class="t" font-weight="700">2 · Memory layer</text>
    <text x="80" y="455" class="sm">update entities + inject context vào query</text>

    <rect x="64" y="472" width="380" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="80" y="490" class="t" font-weight="700">3 · FAQ fast path  (~0ms)</text>
    <text x="80" y="507" class="sm">faq_engine · chỉ khi CHƯA có history → trả lời luôn</text>

    <rect x="64" y="524" width="380" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="80" y="543" class="t" font-weight="700">4 · Planner (LLM1) — tool calling</text>
    <text x="80" y="560" class="sm">chọn 1/8 tool + trích entity (số người, cao, tuổi…)</text>

    <rect x="64" y="578" width="380" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="80" y="597" class="t" font-weight="700">5 · Tool Executor (song song, giữ thứ tự)</text>
    <text x="80" y="614" class="sm">timeout + cô lập lỗi từng tool → Retrieval</text>

    <rect x="64" y="632" width="380" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="80" y="650" class="t" font-weight="700">6 · Merge context + Few-shot</text>
    <text x="80" y="667" class="sm">Golden Store &gt; self-learning + prompt-patch</text>

    <rect x="64" y="684" width="380" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="80" y="703" class="t" font-weight="700">7 · Responder (LLM2) — persona "Tiên"</text>
    <text x="80" y="720" class="sm">5 ngôn ngữ VI/EN/ZH/KO/JA · blocking + stream</text>

    <rect x="64" y="738" width="380" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="80" y="756" class="t" font-weight="700">8 · Guardrail.check_output</text>
    <text x="80" y="773" class="sm">cảnh báo giá/tên nghi bịa (warn)</text>

    <!-- async sidecar -->
    <rect x="470" y="632" width="430" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="5 4"/>
    <text x="486" y="654" class="ttl">9 · Hậu xử lý (async, không block)</text>
    <text x="486" y="676" class="t">• Analytics.track — volume, latency, source</text>
    <text x="486" y="696" class="t">• long_term_memory.learn_from_conversation</text>
    <text x="486" y="716" class="t">• response_critic.critique_and_learn</text>
    <text x="486" y="736" class="t">• self_learning.evaluate_and_learn</text>
    <text x="486" y="760" class="sm">→ chấm điểm, tự sửa, lưu Golden / few-shot</text>
  </g>

