  <text x="990" y="709" class="t">bm25_search — keyword (rank-bm25)</text>
  <rect x="976" y="728" width="288" height="36" rx="6" fill="#fff" stroke="#0284c7"/>
  <text x="990" y="751" class="t">vector_search — BGE-M3 + FAISS + MMR</text>
  <rect x="976" y="770" width="288" height="34" rx="6" fill="#fff" stroke="#0284c7"/>
  <text x="990" y="792" class="t">faq_engine — rule fast path</text>

