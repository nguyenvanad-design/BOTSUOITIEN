  <text x="40" y="70" font-size="14" fill="#64748b">v4 — chat-path hợp nhất qua llm_client → Grok (grok-4.20-0309-non-reasoning) · FastAPI · Hybrid RAG · Self-learning</text>

  <!-- ================= CHANNELS ================= -->
