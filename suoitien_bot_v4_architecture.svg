  <!-- API -> pipeline -->
  <line x1="300" y1="296" x2="254" y2="366" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- ================= LLM GATEWAY ================= -->
  <text x="960" y="334" class="sec">LLM GATEWAY</text>
  <rect x="960" y="346" width="320" height="210" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="976" y="372" class="ttl">core/llm_client.py</text>
  <text x="976" y="392" class="sm">adapter 1 cửa · token tracking</text>
  <text x="976" y="412" class="t">call_tools() · complete() · complete_stream()</text>

  <rect x="980" y="430" width="280" height="50" rx="8" fill="#16a34a"/>
  <text x="1120" y="452" text-anchor="middle" class="wh" font-size="15">Grok (xAI)</text>
  <text x="1120" y="470" text-anchor="middle" fill="#dcfce7" font-size="11">grok-4.20-0309-non-reasoning</text>

  <text x="976" y="502" class="sm">env: LLM_PROVIDER · SUOITIEN_GROK_MODEL</text>
  <text x="976" y="520" class="sm">fallback provider: gemini · anthropic</text>
  <text x="976" y="540" class="sm">~550ms/call · pipeline ~2.4s</text>

  <!-- planner/responder/critic/self_learning -> gateway -->
